<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Forgive Me? 🌈</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to bottom right, #e3f2fd, #e1f5fe);
      font-family: 'Pacifico', cursive;
      text-align: center;
      color: #0277bd;
      padding: 50px;
    }
    img {
      width: 200px;
      border-radius: 20px;
      margin: 20px;
    }
    button {
      background-color: #039be5;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      color: white;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 30px;
    }
    button:hover {
      background-color: #0277bd;
    }
  </style>
</head>
<body>
  <h1>Will You Forgive Me, Paridhi? 🥺</h1>
  <p>I know I don’t deserve it right away, but I promise to be better. Every day.</p>
  <p>Just say the word, and I’ll be the happiest person alive again.</p>
  <img src="https://media.tenor.com/t1hS6EFZJH0AAAAC/sorry-bear.gif" alt="Forgive Me Puppy Eyes">
  <br>
  <button onclick="alert('Thank you, Paridhi! 💖 You’ve made my day.')">Yes, I forgive you 😊</button>
</body>
</html>
